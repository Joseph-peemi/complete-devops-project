---

name: Complete Devops Project Pipeline

on:
  push:
    branches:
      - master

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      # ---- OLD DOCKERHUB STEPS (commented out) ----
      # - name: Build Docker Image
      #   run: |
      #     docker build -t abuchijoe/complete-devops-project:${{ env.SHORT_SHA }} .
      # - name: Login to Dockerhub
      #   run: |
      #     echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      # - name: Push to Dockerhub
      #   run: |
      #     docker push abuchijoe/complete-devops-project:${{ env.SHORT_SHA }}
      # ---- END OLD DOCKERHUB STEPS ----

      # ---- NEW ECR STEPS ----
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push to ECR
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/complete-devops-project:${{ env.SHORT_SHA }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
      # ---- END NEW ECR STEPS ----

      - name: Configure Git Author
        run: |
          git config --local user.email "peemijoe9522@gmail.com"
          git config --local user.name "Joseph-peemi"

      # ---- OLD HELM UPDATE (commented out) ----
      # - name: Update Helm Chart with new Image tag
      #   run: |
      #     sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./complete-devops-project-time-printer/values.yaml
      #     git add ./complete-devops-project-time-printer/values.yaml
      #     git commit -m "Updated image tag to ${{ env.SHORT_SHA }}"
      #     git push
      # ---- END OLD HELM UPDATE ----

      # ---- NEW HELM UPDATE ----
      - name: Update Helm Chart with new Image tag
        run: |
          sed -i "s|repository:.*|repository: ${{ steps.login-ecr.outputs.registry }}/complete-devops-project|" ./complete-devops-project-time-printer/values.yaml
          sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./complete-devops-project-time-printer/values.yaml
          git add ./complete-devops-project-time-printer/values.yaml
          git commit -m "Updated image tag to ${{ env.SHORT_SHA }}"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/Joseph-peemi/complete-devops-project.git
      # ---- END NEW HELM UPDATE ----
